<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Password Required</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 30px;
      max-width: 340px;
      width: 100%;
    }
    .icon {
      width: 60px;
      height: 60px;
      background: rgba(34, 197, 94, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 8px;
    }
    p {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 16px;
      margin-bottom: 16px;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #22c55e;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    .error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
      display: none;
    }
    .error.show { display: block; }
    .buttons {
      display: flex;
      gap: 12px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button.cancel {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    button.cancel:hover { background: rgba(255, 255, 255, 0.2); }
    button.verify {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #fff;
    }
    button.verify:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
    button.verify:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .hint {
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#128272;</div>
    <h1>Password Required</h1>
    <p>Enter admin password to continue</p>

    <div class="error" id="error"></div>

    <input type="password" id="password" placeholder="Enter admin password" autofocus>

    <div class="buttons">
      <button class="cancel" id="cancelBtn">Cancel</button>
      <button class="verify" id="verifyBtn">Verify</button>
    </div>

    <div class="hint">Enter the password set during installation</div>
  </div>

  <script>
    const passwordInput = document.getElementById('password');
    const errorEl = document.getElementById('error');
    const verifyBtn = document.getElementById('verifyBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function hideError() {
      errorEl.classList.remove('show');
    }

    cancelBtn.addEventListener('click', () => {
      window.epm.cancelPasswordDialog();
    });

    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        verifyBtn.click();
      }
    });

    passwordInput.addEventListener('input', () => {
      hideError();
    });

    verifyBtn.addEventListener('click', async () => {
      const password = passwordInput.value;

      if (!password) {
        showError('Please enter your password');
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Verifying...';
      hideError();

      try {
        window.epm.submitPasswordDialog(password);
      } catch (error) {
        showError(error.message || 'Verification failed');
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify';
      }
    });
  </script>
</body>
</html>
