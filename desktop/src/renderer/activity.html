<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>EPM Monitor - Activity</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #334155;
    }

    .header h1 {
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card.productive .stat-value {
      color: #22c55e;
    }

    .stat-card.unproductive .stat-value {
      color: #ef4444;
    }

    .stat-card.neutral .stat-value {
      color: #64748b;
    }

    .stat-card.idle .stat-value {
      color: #f59e0b;
    }

    .section {
      background: #1e293b;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .activity-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .activity-item {
      display: flex;
      align-items: center;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #0f172a;
      transition: background 0.2s ease;
    }

    .activity-item:hover {
      background: #1e293b;
    }

    .activity-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-right: 16px;
    }

    .activity-icon.productive {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
    }

    .activity-icon.unproductive {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .activity-icon.neutral {
      background: rgba(100, 116, 139, 0.2);
      color: #64748b;
    }

    .activity-icon.idle {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
    }

    .activity-content {
      flex: 1;
    }

    .activity-app {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .activity-title {
      font-size: 13px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 400px;
    }

    .activity-time {
      text-align: right;
      margin-left: 16px;
    }

    .activity-duration {
      font-weight: 600;
      font-size: 14px;
    }

    .activity-timestamp {
      font-size: 12px;
      color: #64748b;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .category-legend {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .legend-dot.productive { background: #22c55e; }
    .legend-dot.unproductive { background: #ef4444; }
    .legend-dot.neutral { background: #64748b; }
    .legend-dot.idle { background: #f59e0b; }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }

    .productivity-bar {
      height: 8px;
      background: #0f172a;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 12px;
      display: flex;
    }

    .productivity-segment {
      height: 100%;
      transition: width 0.3s ease;
    }

    .productivity-segment.productive {
      background: #22c55e;
    }

    .productivity-segment.unproductive {
      background: #ef4444;
    }

    .productivity-segment.neutral {
      background: #64748b;
    }

    .productivity-segment.idle {
      background: #f59e0b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <span style="color: #22c55e;">E</span> Recent Activity
      </h1>
      <button class="btn btn-primary" id="refreshBtn">Refresh</button>
    </div>

    <!-- Summary Stats -->
    <div class="stats-grid">
      <div class="stat-card productive">
        <div class="stat-value" id="productiveTime">0m</div>
        <div class="stat-label">Productive</div>
      </div>
      <div class="stat-card unproductive">
        <div class="stat-value" id="unproductiveTime">0m</div>
        <div class="stat-label">Unproductive</div>
      </div>
      <div class="stat-card neutral">
        <div class="stat-value" id="neutralTime">0m</div>
        <div class="stat-label">Neutral</div>
      </div>
      <div class="stat-card idle">
        <div class="stat-value" id="idleTime">0m</div>
        <div class="stat-label">Idle</div>
      </div>
    </div>

    <!-- Productivity Bar -->
    <div class="section">
      <div class="section-title">Today's Activity Distribution</div>
      <div class="productivity-bar" id="productivityBar">
        <div class="productivity-segment productive" id="barProductive" style="width: 0%"></div>
        <div class="productivity-segment unproductive" id="barUnproductive" style="width: 0%"></div>
        <div class="productivity-segment neutral" id="barNeutral" style="width: 0%"></div>
        <div class="productivity-segment idle" id="barIdle" style="width: 0%"></div>
      </div>
      <div class="category-legend" style="margin-top: 16px;">
        <div class="legend-item">
          <div class="legend-dot productive"></div>
          <span>Productive</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot unproductive"></div>
          <span>Unproductive</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot neutral"></div>
          <span>Neutral</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot idle"></div>
          <span>Idle</span>
        </div>
      </div>
    </div>

    <!-- Activity List -->
    <div class="section">
      <div class="section-title">Recent Activities</div>
      <div class="activity-list" id="activityList">
        <div class="loading">Loading activities...</div>
      </div>
    </div>
  </div>

  <script>
    function formatDuration(seconds) {
      if (seconds < 60) return `${seconds}s`;
      if (seconds < 3600) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return secs > 0 ? `${mins}m ${secs}s` : `${mins}m`;
      }
      const hours = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      return mins > 0 ? `${hours}h ${mins}m` : `${hours}h`;
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function getAppIcon(appName) {
      // Map common apps to icons
      const icons = {
        'code': '&#xe943;',
        'devenv': '&#xe943;',
        'chrome': '&#xe774;',
        'msedge': '&#xe774;',
        'firefox': '&#xe774;',
        'slack': '&#xe8f2;',
        'teams': '&#xe8f2;',
        'outlook': '&#xe8c4;',
        'word': '&#xe8c4;',
        'excel': '&#xe80a;',
        'powershell': '&#xe756;',
        'cmd': '&#xe756;',
        'explorer': '&#xe8b7;'
      };

      const name = appName.toLowerCase();
      for (const [app, icon] of Object.entries(icons)) {
        if (name.includes(app)) return icon;
      }
      return '&#xe7c3;'; // Default app icon
    }

    function renderActivity(activity) {
      const category = activity.category || 'neutral';
      const icon = getAppIcon(activity.app_name);

      return `
        <div class="activity-item">
          <div class="activity-icon ${category}">
            ${icon}
          </div>
          <div class="activity-content">
            <div class="activity-app">${activity.app_name}</div>
            <div class="activity-title">${activity.app_title || 'Unknown window'}</div>
          </div>
          <div class="activity-time">
            <div class="activity-duration">${formatDuration(activity.duration_seconds)}</div>
            <div class="activity-timestamp">${formatTime(activity.timestamp)}</div>
          </div>
        </div>
      `;
    }

    async function loadActivities() {
      const activityList = document.getElementById('activityList');
      activityList.innerHTML = '<div class="loading">Loading activities...</div>';

      try {
        const activities = await window.epm.getRecentActivity(50);

        if (!activities || activities.length === 0) {
          activityList.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">&#xe7c3;</div>
              <p>No activity recorded yet</p>
            </div>
          `;
          return;
        }

        // Calculate totals
        let totals = {
          productive: 0,
          unproductive: 0,
          neutral: 0,
          idle: 0
        };

        activities.forEach(a => {
          const cat = a.category || 'neutral';
          if (totals[cat] !== undefined) {
            totals[cat] += a.duration_seconds;
          }
        });

        // Update stats
        document.getElementById('productiveTime').textContent = formatDuration(totals.productive);
        document.getElementById('unproductiveTime').textContent = formatDuration(totals.unproductive);
        document.getElementById('neutralTime').textContent = formatDuration(totals.neutral);
        document.getElementById('idleTime').textContent = formatDuration(totals.idle);

        // Update productivity bar
        const total = totals.productive + totals.unproductive + totals.neutral + totals.idle;
        if (total > 0) {
          document.getElementById('barProductive').style.width = (totals.productive / total * 100) + '%';
          document.getElementById('barUnproductive').style.width = (totals.unproductive / total * 100) + '%';
          document.getElementById('barNeutral').style.width = (totals.neutral / total * 100) + '%';
          document.getElementById('barIdle').style.width = (totals.idle / total * 100) + '%';
        }

        // Render activities
        activityList.innerHTML = activities.map(renderActivity).join('');

      } catch (error) {
        activityList.innerHTML = `
          <div class="empty-state">
            <p>Error loading activities: ${error.message}</p>
          </div>
        `;
      }
    }

    // Refresh button
    document.getElementById('refreshBtn').addEventListener('click', loadActivities);

    // Initial load
    loadActivities();

    // Auto-refresh every 30 seconds
    setInterval(loadActivities, 30000);
  </script>
</body>
</html>
